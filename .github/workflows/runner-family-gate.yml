name: Runner family gate

# Anti-drift gate for the whole Runner family (ADR-0013, docs/wrapper-contract.md).
# Every push, pull request, and calling release workflow must prove that the Python
# reference Orchestrator, the shell + PowerShell ports, and the Rust Dashboard core
# still implement the same Wrapper contract on the operating systems each member
# claims to support. All jobs use fake external tools and scratch repositories, so
# the gate needs neither live Copilot nor GitHub credentials. The shape of this file
# is pinned by git-loopy/python/tests/test_runner_family_gate.py.
#
# Every job here ends by stating an **assertion census** -- how much it actually
# asserted, in its own runner's reporting unit -- and refusing a zero (issue #317).
# A gate that dies loudly goes red and CI says so; a gate handed an empty suite goes
# green having proved nothing, and nothing in the system reports that at all.
# `cargo test` on a crate with no tests and a PowerShell loop over an empty suite
# list were both measured exiting 0. The check is non-zero, never a floor count.

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Python Conformance adapter
        run: >-
          uv run --project git-loopy/python --all-extras
          python -m pytest -q git-loopy/python/tests/test_conformance.py
          git-loopy/python/tests/test_release_identity_conformance.py

      - name: Python test suite
        shell: bash
        run: |
          set -euo pipefail
          uv run --project git-loopy/python --all-extras \
            python -m pytest -q git-loopy/python/tests 2>&1 | tee pytest.log
          .github/scripts/assert-nonzero-census.sh Python \
            "$(.github/scripts/count-passed.sh pytest.log)"

  shell:
    name: shell / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell prerequisites
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install bash jq
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install --yes jq xz-utils
          fi

      - name: Run shell smoke suite
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            BASH_BIN="$(brew --prefix)/bin/bash"
          else
            BASH_BIN="$(command -v bash)"
          fi
          "$BASH_BIN" --version
          # A gate that ran no suite is indistinguishable from a gate that
          # passed. The shell member's only protection was incidental -- an
          # unmatched glob stays literal and bash cannot open it -- and
          # `nullglob` turns that into a green, empty run. So set `nullglob`
          # here and refuse the empty set on purpose.
          shopt -s nullglob
          discovered=(git-loopy/shell/tests/test-*.sh)
          shopt -u nullglob
          if ((${#discovered[@]} == 0)); then
            printf 'shell gate: discovered no suite under git-loopy/shell/tests\n' >&2
            exit 1
          fi
          "$BASH_BIN" -n \
            git-loopy/shell/git-loopy.sh \
            git-loopy/shell/install.sh \
            git-loopy/shell/lib/events.sh \
            git-loopy/shell/lib/issue-lease.sh \
            git-loopy/shell/lib/orchestrator.sh \
            git-loopy/shell/lib/release-version.sh \
            git-loopy/shell/lib/tui-install.sh \
            git-loopy/shell/tests/*.sh
          # The shell suites print no assertion total of their own, so the census is
          # the number of suites this gate actually executed. Counting it -- rather
          # than trusting the list to be non-empty -- is what keeps a list that
          # collapses to nothing (a glob under `nullglob`, say) red instead of green.
          SUITES=(
            git-loopy/shell/tests/test-event-conformance.sh
            git-loopy/shell/tests/test-issue-lease-conformance.sh
            git-loopy/shell/tests/test-orchestrator-conformance.sh
            git-loopy/shell/tests/test-orchestrator-boundary.sh
            git-loopy/shell/tests/test-release-line-conformance.sh
            git-loopy/shell/tests/test-tui-install.sh
          )
          EXECUTED=0
          for SUITE in "${SUITES[@]}"; do
            "$BASH_BIN" "$SUITE"
            EXECUTED=$((EXECUTED + 1))
          done
          .github/scripts/assert-nonzero-census.sh shell "$EXECUTED"

  rust:
    name: Rust Dashboard core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy

      - name: Rust Conformance adapter and suite
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path git-loopy/tui/Cargo.toml --check
          cargo clippy --manifest-path git-loopy/tui/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path git-loopy/tui/Cargo.toml 2>&1 |
            tee "$RUNNER_TEMP/rust-suite.log"
          # An empty Rust suite exits 0 printing `test result: ok. 0 passed`, so
          # the runner's own report is the only evidence an assertion executed.
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' \
            "$RUNNER_TEMP/rust-suite.log"; then
            printf 'Rust gate: the suite executed zero assertions\n' >&2
            exit 1
          fi

  viewer-local-time-windows:
    name: Viewer-local time / windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - name: Prove native Windows timezone resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path git-loopy/tui/Cargo.toml --check
          cargo clippy --manifest-path git-loopy/tui/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path git-loopy/tui/Cargo.toml \
            --bin git-loopy-tui --test viewer_local_time windows_ \
            2>&1 | tee "$RUNNER_TEMP/windows-zone.log"
          if [[ "$(grep -Ec '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/windows-zone.log")" != "2" ]]; then
            printf 'Windows timezone gate: both native test targets must execute assertions\n' >&2
            exit 1
          fi

  powershell:
    name: PowerShell / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PowerShell smoke suite
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7+ is required."
          }
          # `foreach` over an empty match set exits 0 having asserted nothing, so
          # the suite set is discovered and refused when empty before anything
          # runs.
          $SuiteDir = Join-Path "git-loopy" (Join-Path "powershell" "tests")
          $Discovered = @(Get-ChildItem -Path $SuiteDir -Filter "test-*.ps1")
          if ($Discovered.Count -eq 0) {
            throw "PowerShell gate: discovered no suite under $SuiteDir"
          }
          # `shell: pwsh` propagates only the *last* native command's exit code,
          # so every suite's status has to be read where it is produced.
          function Invoke-Suite {
            param(
              [Parameter(Mandatory)]
              [string]$Suite
            )

            pwsh -NoLogo -NoProfile -File $Suite
            if ($LASTEXITCODE -ne 0) {
              throw "PowerShell gate: $Suite failed with exit $LASTEXITCODE"
            }
          }
          Invoke-Suite git-loopy/powershell/tests/test-event-conformance.ps1
          Invoke-Suite git-loopy/powershell/tests/test-issue-lease-conformance.ps1
          Invoke-Suite git-loopy/powershell/tests/test-orchestrator-conformance.ps1
          Invoke-Suite git-loopy/powershell/tests/test-orchestrator-boundary.ps1
          Invoke-Suite git-loopy/powershell/tests/test-release-line-conformance.ps1
          Invoke-Suite git-loopy/powershell/tests/test-tui-install.ps1

  run-control:
    # The Run control/liveness seam is the one part of the Python member whose
    # answer is produced by the *operating system* rather than by Python: a Run
    # is alive iff its control artifact's advisory lock is still held, which is
    # `flock` on POSIX and `LockFileEx` on native Windows (#584, ADR-0058). The
    # `python` job above runs on Linux alone, so until this job existed the
    # Windows half of that claim was never executed anywhere. A member that
    # claims a platform and proves it on another is claiming `unknown`.
    name: Run control / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Run control and discovery suites
        shell: bash
        run: |
          set -euo pipefail
          uv run --project git-loopy/python --all-extras \
            python -m pytest -q \
            git-loopy/python/tests/test_run_control.py \
            git-loopy/python/tests/test_run_discovery.py 2>&1 | tee pytest.log
          # A platform whose cases were all skipped asserted nothing about that
          # platform, and pytest exits 0 on an all-skipped run. The census reads
          # what pytest said it *passed*, so a silently skipped matrix leg is
          # red here rather than green.
          .github/scripts/assert-nonzero-census.sh "Run control" \
            "$(.github/scripts/count-passed.sh pytest.log)"
