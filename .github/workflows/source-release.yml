name: Publish source Release

on:
  push:
    tags:
      - "v*"

jobs:
  tag-preflight:
    name: Verify committed Release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      distribution_mode: ${{ steps.preflight.outputs.distribution_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore annotated publication tag
        run: git fetch --force --no-tags origin "$GITHUB_REF:$GITHUB_REF"

      - name: Verify annotated tag and committed Release identity
        id: preflight
        env:
          PYTHONPATH: git-loopy/python
        run: >-
          python3 -m git_loopy.source_release
          --repository-root .
          --tag-ref "$GITHUB_REF"
          --tag-only
          --github-output "$GITHUB_OUTPUT"

  family-conformance:
    name: Prove Runner-family Conformance
    needs: tag-preflight
    uses: ./.github/workflows/runner-family-gate.yml

  publish:
    name: Verify and publish source Release
    needs:
      - tag-preflight
      - family-conformance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore annotated publication tag
        run: git fetch --force --no-tags origin "$GITHUB_REF:$GITHUB_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Verify tagged source archive and public identities
        id: release
        run: >-
          uv run --project git-loopy/python --all-extras
          python -m git_loopy.source_release
          --repository-root .
          --tag-ref "$GITHUB_REF"
          --distribution-mode "${{ needs.tag-preflight.outputs.distribution_mode }}"
          --archive-output "$RUNNER_TEMP/git-loopy-source.tar"
          --github-output "$GITHUB_OUTPUT"

      # A Promotion already published this Release through the reconciliation
      # boundary. Creating it again would fail a successful release. This
      # reconciles: a match is a no-op, a mismatch refuses, an absent Release
      # (a human prerelease tag) is created. It never pushes a tag.
      - name: Reconcile the GitHub Release for this already-public tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --project git-loopy/python --all-extras
          python -m git_loopy.source_release
          --repository-root .
          --tag-ref "$GITHUB_REF"
          --distribution-mode "${{ needs.tag-preflight.outputs.distribution_mode }}"
          --archive-output "$RUNNER_TEMP/git-loopy-source-reconcile.tar"
          --ensure-release
