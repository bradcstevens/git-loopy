name: Lint the workflows

# Lint this repository's CI definitions, not the availability of their runners.
#
# actionlint catches unknown runner labels, invalid expression contexts and
# shell mistakes in `run:` blocks, but its label roster can lag GitHub's
# retirements. A retired image can produce a cancelled job annotated
# "The configuration '<label>-...' is not supported" while actionlint stays
# green. That happened to the Apple-silicon helper on `macos-14`.
#
# runner-canary.yml exercises the versioned pins daily to expose brownouts and
# retirements before a Release needs them. actionlint stays pinned to an exact
# release so its rule set cannot change silently. This file's shape is guarded
# by git-loopy/python/tests/test_workflow_lint.py.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@v4

      # Installed from source at an exact tag rather than through a third-party
      # action or a piped installer script: the Go toolchain is already on the
      # runner, and this keeps the supply chain to one pinned upstream module.
      - name: Install the pinned linter
        shell: bash
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Report the pinned linter version
        shell: bash
        run: actionlint -version

      # Bare `actionlint` discovers every workflow in the repository itself -- a
      # workflow added tomorrow must be linted without anyone remembering to add
      # it to a list here.
      - name: Lint every workflow
        shell: bash
        run: actionlint
