name: Release smoke

# The bounded real-host **release smoke** (#588, ADR-0058, ADR-0059): install
# the exact candidate a Rehearsal proved into a clean installation, then drive
# the public operator commands -- init cancelled and saved, `runs`, `attach` and
# Detach, the announced helper fallback, and the two-stage acknowledged `stop` --
# against disposable work on the local host and on GitHub Actions.
#
# Release-only by construction. It reaches GitHub, Copilot and the package
# index, so it is never an Integration feedback loop: an unreachable service
# would make a Lane merge red for a reason no change caused. The deterministic
# offline matrix (the Python suite) stays responsible for every fault scenario;
# this proves the composed operator path once, per candidate.
#
# Nothing here waits for a person: no protected environment and no approval,
# so a configured smoke runs unattended (ADR-0052). Configuration is explicit
# and never guessed -- see docs/releases/README.md#the-release-smoke:
#
#   secrets.RELEASE_SMOKE_TOKEN        the one credential the smoke spends
#   vars.RELEASE_SMOKE_REPOSITORY      a disposable owner/name repository that
#                                      carries the git-loopy-release-smoke topic
#   vars.RELEASE_SMOKE_MAX_RUNS        work limit (Runs started)
#   vars.RELEASE_SMOKE_DEADLINE_SECONDS time limit, at most 6000 (the smoke
#                                      step's 110-minute timeout, less cleanup)
#   vars.RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS  spend limit
#
# Anything missing is a blocked verdict with evidence, not a skip. The evidence
# is uploaded whatever the verdict, bound to the candidate's proof.
#
# The Promotion gate calls the same smoke. This workflow tags nothing.

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Stable Release commit on the trunk to rehearse and smoke
        required: false
        type: string
      promote_milestone:
        description: Closed vX.Y.Z milestone whose promoted snapshot to smoke
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_commit:
        required: false
        type: string
      promote_milestone:
        required: false
        type: string
    secrets:
      RELEASE_SMOKE_TOKEN:
        required: false
    outputs:
      verdict:
        description: passed, failed, blocked or inconclusive
        value: ${{ jobs.smoke.outputs.verdict }}

# The smoke spends only its own configured credential; the job token stays
# read-only and is never handed to the operator environment.
permissions:
  contents: read

concurrency:
  group: release-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke the rehearsed candidate on real hosts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      verdict: ${{ steps.smoke.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Attribute the Rehearsal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # The local Execution host runs the Agent through the Copilot CLI on
      # PATH, at the version the Lane contribution host pins.
      - name: Install the pinned Copilot CLI
        shell: bash
        run: npm install --global @github/copilot@1.0.75

      - name: Rehearse the candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PROMOTE_MILESTONE: ${{ inputs.promote_milestone }}
        run: |
          if [[ -n "$CANDIDATE_COMMIT" && -n "$PROMOTE_MILESTONE" ]] ||
             [[ -z "$CANDIDATE_COMMIT" && -z "$PROMOTE_MILESTONE" ]]; then
            echo "::error::pass exactly one of candidate_commit or promote_milestone" >&2
            exit 1
          fi
          if [[ -n "$CANDIDATE_COMMIT" ]]; then
            trigger=(--stable-commit --candidate-commit "$CANDIDATE_COMMIT")
          else
            trigger=(--promote-milestone "$PROMOTE_MILESTONE")
          fi
          uv run --project git-loopy/python --all-extras \
            python -m git_loopy.release_rehearsal \
            --repository-root . \
            --workspace "$RUNNER_TEMP/rehearsal/candidate" \
            --archive-output "$RUNNER_TEMP/rehearsal/git-loopy-source.tar" \
            --distribution-mode source-only \
            "${trigger[@]}" \
            > "$RUNNER_TEMP/publication-input.json"

      # Cut short by the step timeout, the smoke would reclaim nothing and write
      # no evidence; its own deadline has to end it first, with cleanup to spare.
      - name: Smoke the candidate
        id: smoke
        timeout-minutes: 110
        shell: bash
        env:
          GIT_LOOPY_SMOKE_TOKEN: ${{ secrets.RELEASE_SMOKE_TOKEN }}
          GIT_LOOPY_SMOKE_REPOSITORY: ${{ vars.RELEASE_SMOKE_REPOSITORY }}
          GIT_LOOPY_SMOKE_MAX_RUNS: ${{ vars.RELEASE_SMOKE_MAX_RUNS }}
          GIT_LOOPY_SMOKE_DEADLINE_SECONDS: ${{ vars.RELEASE_SMOKE_DEADLINE_SECONDS }}
          GIT_LOOPY_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS: ${{ vars.RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS }}
        run: |
          evidence="$RUNNER_TEMP/release-smoke-evidence.json"
          if [[ "$GIT_LOOPY_SMOKE_DEADLINE_SECONDS" =~ ^[0-9]+([.][0-9]+)?$ ]] &&
             awk -v d="$GIT_LOOPY_SMOKE_DEADLINE_SECONDS" 'BEGIN { exit !(d > 6000) }'; then
            echo "::error::RELEASE_SMOKE_DEADLINE_SECONDS=$GIT_LOOPY_SMOKE_DEADLINE_SECONDS" \
              "exceeds 6000: the step timeout would end the smoke before its" \
              "own deadline could reclaim its work. See docs/releases/README.md." >&2
            exit 1
          fi
          set +e
          uv run --project git-loopy/python --all-extras \
            python -m git_loopy.release_smoke \
            --publication-input "$RUNNER_TEMP/publication-input.json" \
            --workspace "$RUNNER_TEMP/smoke" \
            --evidence-output "$evidence"
          status=$?
          set -e
          verdict="$(jq -r '.verdict // "failed"' "$evidence" 2>/dev/null || echo failed)"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload the smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-evidence
          path: |
            ${{ runner.temp }}/release-smoke-evidence.json
            ${{ runner.temp }}/publication-input.json
          if-no-files-found: warn
