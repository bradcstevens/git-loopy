name: Pinned runner canary

# Availability, not a workload: actionlint's roster can lag image retirements.
# Keep this matrix equal to the other workflows' versioned hosted runner labels.
# git-loopy/python/tests/test_runner_canary.py proves the offline shape and set.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - ubuntu-22.04
          - windows-2022
    steps:
      - name: Report runner image
        shell: bash
        run: |
          printf 'ImageOS=%s\nImageVersion=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' \
            "$ImageOS" "$ImageVersion" "$RUNNER_OS" "$RUNNER_ARCH"
