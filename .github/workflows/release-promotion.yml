name: Promote Release line

# The unattended **Promotion** (ADR-0052, ADR-0066): cutting a stable Release
# version from a Release line, with nobody awake.
#
# Closing a `vX.Y.Z` milestone promotes the `-alpha.N`, `-beta.N` or `-rc.N`
# line that milestone named -- "whenever it makes sense" replaced by a tracker
# event that already exists. It is the only way a stable value reaches `main`:
# a `major` is a prerelease like any other bump (ADR-0066). Every push is still
# inspected, so a stable commit whose tag failed to push is found again.
# Prereleases consult no milestone and are tagged here at no point, so they
# reach no package channel.
#
# `workflow_dispatch` is the operator's stage advance: it moves the current
# prerelease line forward to `beta` or `rc`, restarting its counter at 1, and
# commits that to `main`. It tags nothing; a prerelease tag stays a human act.
#
# Nothing here waits for a person: no protected environment, no review, no
# approval. That is the decision ADR-0052 recorded as taken deliberately rather
# than overlooked, and it is not to be re-added as an implementation detail.
#
# The tag is the whole point of the workflow, and it is not created here.
# `git_loopy.release_promotion` rehearses the exact commit, requires a passed
# release smoke of that proof, and publishes the proved tag object through the
# reconciliation boundary. A tag pushed with the default `GITHUB_TOKEN` creates
# no workflow run at all, and a smoke whose credential or limits were invented
# is not proof, so the Promotion is refused before it mutates anything when
# either is missing, rather than half happening.
#
# A tag is immutable once it is public (ADR-0059). A refusal leaves no tag
# rather than a public identity nothing verified. `source-release.yml` still
# runs when the proved tag is pushed; it reconciles the Release and does not
# create a second one.

on:
  milestone:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Prerelease stage to advance the current Release line to
        required: true
        type: choice
        options: [beta, rc]

# Every write here travels on the publication token rather than on this one, so
# the workflow's own token stays read-only.
permissions:
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Cut the stable Release a milestone promised
    # A milestone that is not a Release promise -- `Backlog`, `Q3` -- promotes
    # nothing; every push to the trunk is inspected for an untagged stable value.
    if: >-
      github.event_name == 'push' ||
      startsWith(github.event.milestone.title, 'v')
    runs-on: ubuntu-latest
    # Rehearsal runs the family gate, then the smoke's own deadline (at most
    # 6000s) reclaims its work. The step timeout has to outlast both.
    timeout-minutes: 360
    steps:
      # First, before the checkout: a Promotion is all-or-nothing. Committing a
      # stable version to the trunk and then discovering there is no token, no
      # smoke credential, or no finite limit to publish it with would leave
      # `main` claiming a Release that does not exist. Nothing here is invented.
      - name: Require the publication token and smoke limits a Promotion cannot finish without
        shell: bash
        env:
          RELEASE_PUBLICATION_TOKEN: ${{ secrets.RELEASE_PUBLICATION_TOKEN }}
          RELEASE_SMOKE_TOKEN: ${{ secrets.RELEASE_SMOKE_TOKEN }}
          RELEASE_SMOKE_REPOSITORY: ${{ vars.RELEASE_SMOKE_REPOSITORY }}
          RELEASE_SMOKE_MAX_RUNS: ${{ vars.RELEASE_SMOKE_MAX_RUNS }}
          RELEASE_SMOKE_DEADLINE_SECONDS: ${{ vars.RELEASE_SMOKE_DEADLINE_SECONDS }}
          RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS: ${{ vars.RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS }}
        run: |
          missing=()
          [[ -n "$RELEASE_PUBLICATION_TOKEN" ]] || missing+=("RELEASE_PUBLICATION_TOKEN")
          [[ -n "$RELEASE_SMOKE_TOKEN" ]] || missing+=("RELEASE_SMOKE_TOKEN")
          [[ -n "$RELEASE_SMOKE_REPOSITORY" ]] || missing+=("RELEASE_SMOKE_REPOSITORY")
          [[ -n "$RELEASE_SMOKE_MAX_RUNS" ]] || missing+=("RELEASE_SMOKE_MAX_RUNS")
          [[ -n "$RELEASE_SMOKE_DEADLINE_SECONDS" ]] || missing+=("RELEASE_SMOKE_DEADLINE_SECONDS")
          [[ -n "$RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS" ]] || missing+=("RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::a Promotion cannot finish without ${missing[*]}." \
              "A v* tag pushed with GITHUB_TOKEN starts no publication run," \
              "and a smoke whose credential or limits were invented would not" \
              "be proof. See docs/releases/README.md." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_SMOKE_MAX_RUNS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::RELEASE_SMOKE_MAX_RUNS must be a positive integer," \
              "got '$RELEASE_SMOKE_MAX_RUNS'. See docs/releases/README.md." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_SMOKE_DEADLINE_SECONDS" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             awk -v d="$RELEASE_SMOKE_DEADLINE_SECONDS" 'BEGIN { exit !(d > 0 && d <= 6000) }'; then
            echo "::error::RELEASE_SMOKE_DEADLINE_SECONDS must be finite, positive," \
              "and at most 6000 so the smoke can reclaim its work, got" \
              "'$RELEASE_SMOKE_DEADLINE_SECONDS'. See docs/releases/README.md." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             awk -v s="$RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS" 'BEGIN { exit !(s > 0) }'; then
            echo "::error::RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS must be a" \
              "positive number, got '$RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS'." \
              "See docs/releases/README.md." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_PUBLICATION_TOKEN }}

      # `git commit` refuses without one, and a GitHub runner configures none.
      # The proved tag is created inside the rehearsal, which sets its own.
      - name: Attribute the Promotion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Promote the line this closed milestone promised
        id: milestone
        if: github.event_name == 'milestone'
        env:
          MILESTONE_TITLE: ${{ github.event.milestone.title }}
          MILESTONE_STATE: ${{ github.event.milestone.state }}
        run: >-
          uv run --project git-loopy/python --all-extras
          python -m git_loopy.release_version
          --repository-root .
          --promote-milestone "$MILESTONE_TITLE"
          --milestone-state "$MILESTONE_STATE"
          --github-output "$GITHUB_OUTPUT"

      # `-a` rather than a path list: the copies a Release version is written to
      # are `release_version.RELEASE_VERSION_PATHS`, and a second list here would
      # be one nothing keeps in step. The writer is the only thing that has
      # touched this checkout.
      - name: Publish the milestone Promotion to the trunk
        if: steps.milestone.outputs.promoted == 'true'
        shell: bash
        env:
          SUBJECT: ${{ steps.milestone.outputs.subject }}
          NOTES_PATH: ${{ steps.milestone.outputs.notes_path }}
          FRAGMENT_PATH: ${{ steps.milestone.outputs.fragment_path }}
        run: |
          git add -- "$NOTES_PATH" "$FRAGMENT_PATH"
          git commit -aqm "$SUBJECT"
          git push origin HEAD:main

      # Every stable Release the trunk carries that no tag reaches yet, oldest
      # first -- not the value at the head. Both triggers enter this one entry.
      #
      # A Run pushes once per Iteration and lands a Release-line commit per
      # contribution, so a committed Promotion can be followed by the next
      # issue's prerelease advance inside the same push: reading `VERSION` alone
      # would see a prerelease and drop the stable Release, with nothing red to
      # say so. The entry walks those commits itself. It rehearses each exact
      # commit, requires a passed release smoke of that proof, and publishes
      # the proved tag object. It does not compose a second tag, and a refusal
      # leaves no new public tag.
      - name: Publish every untagged stable Release the trunk already carries
        timeout-minutes: 300
        shell: bash
        env:
          # `gh` creates the Release with this token. The smoke strips it from
          # the operator environment and spends only GIT_LOOPY_SMOKE_TOKEN.
          GH_TOKEN: ${{ secrets.RELEASE_PUBLICATION_TOKEN }}
          GIT_LOOPY_SMOKE_TOKEN: ${{ secrets.RELEASE_SMOKE_TOKEN }}
          GIT_LOOPY_SMOKE_REPOSITORY: ${{ vars.RELEASE_SMOKE_REPOSITORY }}
          GIT_LOOPY_SMOKE_MAX_RUNS: ${{ vars.RELEASE_SMOKE_MAX_RUNS }}
          GIT_LOOPY_SMOKE_DEADLINE_SECONDS: ${{ vars.RELEASE_SMOKE_DEADLINE_SECONDS }}
          GIT_LOOPY_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS: ${{ vars.RELEASE_SMOKE_SPEND_LIMIT_PREMIUM_REQUESTS }}
        run: >-
          uv run --project git-loopy/python --all-extras
          python -m git_loopy.release_promotion
          --repository-root .
          --workspace "$RUNNER_TEMP/promotion"
          --archive-output "$RUNNER_TEMP/git-loopy-source.tar"
          --evidence-output "$RUNNER_TEMP/release-smoke-evidence.json"
          --distribution-mode source-only
          --publish-untagged-stable

      - name: Upload the release-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-promotion-smoke-evidence
          path: ${{ runner.temp }}/promotion
          if-no-files-found: warn

  advance-stage:
    name: Advance the prerelease line to the stage the operator chose
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require the publication token the trunk push needs
        shell: bash
        env:
          RELEASE_PUBLICATION_TOKEN: ${{ secrets.RELEASE_PUBLICATION_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PUBLICATION_TOKEN" ]]; then
            echo "::error::RELEASE_PUBLICATION_TOKEN is unset: the stage advance" \
              "cannot be pushed to the trunk. See docs/releases/README.md." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_PUBLICATION_TOKEN }}

      - name: Attribute the stage advance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # Refuses a stable line and any stage that is not strictly forward, before
      # anything is written.
      - name: Move the current prerelease line to the chosen stage
        id: stage
        env:
          STAGE: ${{ inputs.stage }}
        run: >-
          uv run --project git-loopy/python --all-extras
          python -m git_loopy.release_version
          --repository-root .
          --advance-stage "$STAGE"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish the stage advance to the trunk
        if: steps.stage.outputs.advanced == 'true'
        shell: bash
        env:
          SUBJECT: ${{ steps.stage.outputs.subject }}
          FRAGMENT_PATH: ${{ steps.stage.outputs.fragment_path }}
        run: |
          git add -- "$FRAGMENT_PATH"
          git commit -aqm "$SUBJECT"
          git push origin HEAD:main
