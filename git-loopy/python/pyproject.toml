[project]
name = "git-loopy"
version = "0.11.0-dev.4"
description = "git-loopy — encode engineering knowledge into repeatable, autonomous workflows on the GitHub Copilot Python SDK."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "git-loopy contributors" }]
keywords = ["github-copilot", "git-loopy", "autonomous", "agent", "afk"]

# Runtime deps. The SDK is pinned to an exact PyPI version: the upstream
# `github-copilot-sdk` is documented as "public preview" and "may change in
# breaking ways" (see PRD #1, "Further Notes"), so future slices should bump
# this pin deliberately rather than tracking `main`.
#
# SDK 1.0.13 pins CLI 1.0.83 and is available through the corporate Python feed.
# Treat a pin change as a tested migration: check client/session construction,
# permissions, events, Skill discovery, and pinned-harness roster provenance.
#
# Rich is the renderer for the Python variant's terminal experience
# (streaming prints + frozen iteration Panels + a frozen run-end Table).
dependencies = [
    "github-copilot-sdk==1.0.13",
    "rich>=13.7.0,<14",
    # Textual 7.0.0 raises its floor to rich>=14.2.0, while the Run renderer
    # pins Rich 13. Textual 6 and below require only rich>=13.3.3.
    "textual>=0.86,<6",
]

[project.optional-dependencies]
# Optional OpenTelemetry export. Off by default so the base install stays
# light. Operators who run an OTel collector flip it on by either setting
# OTEL_EXPORTER_OTLP_ENDPOINT or GIT_LOOPY_OTEL_ENABLED=1 — see issue #12.
otel = [
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp>=1.20,<2",
]

# Release-channel tooling (issue #196). winget's manifests are YAML, and the
# channel gate reads the *committed* text back with the same kind of parser
# winget resolves it with rather than a line-shaped reader that could disagree
# with it. Kept out of the base install because the standing rule still holds:
# the runtime runner never reads YAML. Only `python -m
# git_loopy.windows_channels` does, in release automation, which installs every
# extra.
release = [
    "pyyaml>=6",
]

# Development tooling. Exposed as an extra (not a PEP 735 dependency-group) so
# it can be installed with `uv pip install -e ".[dev]"` / `pip install -e ".[dev]"`.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0.0",
    "ruff>=0.1.0",
    "ty>=0.0.2,<0.0.25",
    "httpx>=0.24.0",
    # Parses the CI workflow(s) in the Runner-family gate guard
    # (tests/test_runner_family_gate.py). Dev/test-only; the runtime runner
    # never reads YAML.
    "pyyaml>=6",
]

[project.scripts]
git-loopy = "git_loopy.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["git_loopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
