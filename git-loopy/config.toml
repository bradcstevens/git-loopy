# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "gpt-6.1-sol"
reasoning_effort = "max"
context_tier = "long_context"
route_policy = "static"

# Quality-first static preset, live-verified against the pinned harness (ADR-0048).
# Every route inherits long_context. Review/tests use Anthropic; implementation
# and docs use OpenAI. The built-in legacy retry rung is GPT-6.1 Sol/max;
# static routing only changes a retry's pair with an explicit [escalation] block.

[routing.planning]
model = "gpt-6.1-sol"
effort = "xhigh"

[routing.review]
model = "claude-sonnet-5.5"
effort = "xhigh"

[routing.implementation]
model = "gpt-6.1-sol"
effort = "high"

[routing.test]
model = "claude-sonnet-5.5"
effort = "high"

[routing.docs]
model = "gpt-6.1-sol"
effort = "low"

[routing.chore]
model = "gpt-6-luna"
effort = "medium"

[routing.bugfix]
model = "gpt-6.1-sol"
effort = "xhigh"
