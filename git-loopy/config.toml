# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "claude-opus-5"
reasoning_effort = "max"

# Per-issue routing (ADR-0048, superseding ADR-0035's values). This is the
# recommended table, seeded here because the flagship consumer of routing has to
# route: without a `[routing]` table every issue in this repository resolves
# through the early return in `resolve_iteration_model` and no `task-type:` label
# is ever read.
#
# The run-wide pair above is what an unlabelled issue gets, and it is deliberately
# the ceiling (`max`, ADR-0056 superseding ADR-0036). It therefore *equals* the
# escalation rung (`claude-opus-5 @ max`), so an unlabelled issue that stalls
# silently is retried at the identical pair — a known no-op, accepted because the
# first attempt is the one that matters. No route below holds `max`, so escalation
# is still a real pair change for every Task type that carries a label.
[routing.planning]
model = "claude-opus-5"
effort = "xhigh"

[routing.review]
model = "claude-opus-5"
effort = "high"

[routing.implementation]
model = "gpt-5.6-terra"
effort = "high"

[routing.test]
model = "gemini-3.6-flash"
effort = "high"

[routing.docs]
model = "gpt-5.6-terra"
effort = "low"

[routing.chore]
model = "gpt-5.6-luna"
effort = "medium"

[routing.bugfix]
model = "claude-opus-5"
effort = "xhigh"
