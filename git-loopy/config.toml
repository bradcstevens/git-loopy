# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "claude-opus-5"
reasoning_effort = "xhigh"

# Per-issue routing (ADR-0048, superseding ADR-0035's values). This is the
# recommended table, seeded here because the flagship consumer of routing has to
# route: without a `[routing]` table every issue in this repository resolves
# through the early return in `resolve_iteration_model` and no `task-type:` label
# is ever read.
#
# The run-wide pair above is what an unlabelled issue gets. It is deliberately
# one rung below the escalation rung (`claude-opus-5 @ max`), so the default
# reserves the ceiling rather than spending it (ADR-0036). No route below holds
# `max` either, so escalation stays live for every Task type.
[routing.planning]
model = "claude-opus-5"
effort = "xhigh"

[routing.review]
model = "claude-opus-5"
effort = "high"

[routing.implementation]
model = "gpt-5.6-terra"
effort = "high"

[routing.test]
model = "gemini-3.6-flash"
effort = "high"

[routing.docs]
model = "gpt-5.6-terra"
effort = "low"

[routing.chore]
model = "gpt-5.6-luna"
effort = "medium"

[routing.bugfix]
model = "claude-opus-5"
effort = "xhigh"
