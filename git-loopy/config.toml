# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "gpt-6-astra"
reasoning_effort = "medium"

# Project-specific routes override the built-in recommendations (ADR-0048)
# without changing them. Unlabelled issues use the Astra/medium pair above.
# The review route sits one step below the default escalation rung, Opus 5/max,
# so a stalled review retries at a strictly higher effort than it started on.

[routing.planning]
model = "gpt-6-astra"
effort = "xhigh"

[routing.review]
model = "claude-opus-5"
effort = "xhigh"

[routing.implementation]
model = "grok-4.7"
effort = "high"

[routing.test]
model = "claude-opus-5"
effort = "high"

[routing.docs]
model = "gpt-5.6-luna"
effort = "medium"

[routing.chore]
model = "gpt-5.6-luna"
effort = "medium"

[routing.bugfix]
model = "claude-opus-5"
effort = "xhigh"
