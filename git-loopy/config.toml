# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "gpt-6-astra"
reasoning_effort = "high"

# Project-specific routes override the built-in recommendations (ADR-0048)
# without changing them. Unlabelled issues use the Astra/high pair above.
# The review route already equals the default escalation rung, Opus 5/max;
# a retry at that rung does not change its pair.

[routing.planning]
model = "gpt-6-astra"
effort = "max"

[routing.review]
model = "claude-opus-5"
effort = "max"

[routing.implementation]
model = "grok-4.7"
effort = "high"

[routing.test]
model = "claude-sonnet-5"
effort = "high"

[routing.docs]
model = "gpt-5.6-luna"
effort = "low"

[routing.chore]
model = "gpt-5.6-luna"
effort = "low"

[routing.bugfix]
model = "claude-opus-5"
effort = "xhigh"
