# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "claude-opus-5.5"
reasoning_effort = "medium"

# Project-specific routes override the built-in recommendations (ADR-0048)
# without changing them. Unlabelled issues use the Opus 5.5/medium pair above.
# Review runs on Anthropic while implementation runs on xAI and docs on OpenAI,
# so neither is reviewed by its own vendor (ADR-0048's cross-vendor review).
# A silently stalled issue is retried at the escalation rung, by default
# Opus 5/max. That moves each Opus 5.5 route to the older Opus 5: planning and
# review, already at max, keep their effort, while test and bugfix gain effort.

[routing.planning]
model = "claude-opus-5.5"
effort = "max"

[routing.review]
model = "claude-opus-5.5"
effort = "max"

[routing.implementation]
model = "grok-4.7"
effort = "high"

[routing.test]
model = "claude-opus-5.5"
effort = "high"

[routing.docs]
model = "gpt-6-sol"
effort = "low"

[routing.chore]
model = "gpt-6-sol"
effort = "low"

[routing.bugfix]
model = "claude-opus-5.5"
effort = "high"
