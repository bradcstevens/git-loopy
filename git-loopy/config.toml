# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "claude-opus-5.5"
reasoning_effort = "high"
context_tier = "long_context"
route_policy = "static"

# Static preset mirroring the maintainer's global Config. Every route inherits
# long_context. Planning/review use Claude Opus; implementation, tests, docs and
# bugfix use GPT-6.1 Sol; chores use Claude Haiku. The built-in legacy retry rung
# is GPT-6.1 Sol/max; static routing only changes a retry's pair with an explicit
# [escalation] block.

[routing.planning]
model = "claude-opus-5.5"
effort = "xhigh"

[routing.review]
model = "claude-opus-5.5"
effort = "high"

[routing.implementation]
model = "gpt-6.1-sol"
effort = "high"

[routing.test]
model = "gpt-6.1-sol"
effort = "high"

[routing.docs]
model = "gpt-6.1-sol"
effort = "low"

[routing.chore]
model = "claude-haiku-5.5"
effort = "medium"

[routing.bugfix]
model = "gpt-6.1-sol"
effort = "xhigh"
