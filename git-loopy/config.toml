# git-loopy persisted Config (hand-editable).
# Precedence: CLI flag > env > project > global > built-in default.
# Edit freely, or manage with `git-loopy init` / `git-loopy config`.

model = "claude-opus-5"
reasoning_effort = "xhigh"

# Per-issue routing (ADR-0035). This is the locked recommended table, seeded
# here because the flagship consumer of routing has to route: without a
# `[routing]` table every issue in this repository resolves through the early
# return in `resolve_iteration_model` and no `task-type:` label is ever read.
#
# The run-wide pair above is what an unlabelled issue gets. It is deliberately
# one rung below the escalation rung (`claude-opus-5 @ max`), so the default
# reserves the ceiling rather than spending it (ADR-0036).
[routing.planning]
model = "claude-opus-5"
effort = "max"

[routing.review]
model = "gpt-5.6-terra"
effort = "xhigh"

[routing.implementation]
model = "claude-sonnet-5"
effort = "low"

[routing.test]
model = "claude-sonnet-5"
effort = "medium"

[routing.docs]
model = "claude-sonnet-5"
effort = "low"

[routing.chore]
model = "gpt-5.6-luna"
effort = "none"

[routing.bugfix]
model = "claude-opus-5"
effort = "xhigh"
